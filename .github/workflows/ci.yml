name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-quality:
    name: Foundation quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PSR_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PSR_TEST_OWNER_DATABASE_URL: postgresql://psr_test_owner:psr_test@127.0.0.1:5432/psr_test
      PSR_TEST_RUNTIME_DATABASE_URL: postgresql://psr_test_runtime:psr_test@127.0.0.1:5432/psr_test
      PSR_TEST_OWNER_ROLE: psr_test_owner
      PSR_TEST_RUNTIME_ROLE: psr_test_runtime
      PSR_TEST_DATABASE: psr_test
      PSR_TEST_ROLE_PASSWORD: psr_test
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.15"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --all-groups --frozen

      - name: Audit locked dependencies
        run: uv audit --preview-features audit --frozen

      - name: Verify dependency license manifest
        run: uv run --frozen python scripts/dependency_licenses.py --check

      - name: Bootstrap PostgreSQL test roles and database
        run: uv run --frozen python scripts/bootstrap_postgres_test.py

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen mypy src tests scripts

      - name: Test with branch coverage
        run: >-
          uv run --frozen pytest --cov=psr_mcp --cov-branch
          --cov-report=term-missing --cov-report=json:coverage.json

      - name: Enforce separate coverage thresholds
        run: uv run --frozen python scripts/coverage_gate.py --coverage-json coverage.json

      - name: Build distribution
        run: uv build

      - name: Generate release SBOM
        run: >-
          uv export --preview-features sbom-export --frozen --no-dev
          --format cyclonedx1.5 --output-file dist/sbom.cdx.json

      - name: Verify release SBOM
        run: test -s dist/sbom.cdx.json

  public-image:
    name: Public Preview OCI gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_BUILDKIT: "1"
      NGINX_IMAGE: "nginx:1.30.4-alpine@sha256:59d10bca5c674965ef4ff884715000dd60ef5567c36663523f108eec8e4105d4"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify fail-closed container contract
        run: python3 scripts/verify_container_contract.py

      - name: Verify fail-closed gateway contract
        run: python3 scripts/verify_gateway_contract.py

      - name: Generate synthetic gateway certificate
        run: |
          mkdir -p "${RUNNER_TEMP}/psr-gateway-tls"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "${RUNNER_TEMP}/psr-gateway-tls/tls.key" \
            -out "${RUNNER_TEMP}/psr-gateway-tls/tls.crt" \
            -days 1 \
            -subj "/CN=research.example.org" \
            -addext "subjectAltName=DNS:research.example.org"
          chmod 0644 \
            "${RUNNER_TEMP}/psr-gateway-tls/tls.key" \
            "${RUNNER_TEMP}/psr-gateway-tls/tls.crt"

      - name: Render and validate hardened gateway
        run: >-
          docker run --rm
          --user 101:101
          --read-only
          --cap-drop=ALL
          --security-opt=no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
          --add-host psr-public:127.0.0.1
          --volume "${PWD}/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          --volume "${PWD}/deploy/nginx/templates:/etc/nginx/templates:ro"
          --volume "${PWD}/deploy/nginx/entrypoint/15-psr-validate-env.sh:/docker-entrypoint.d/15-psr-validate-env.sh:ro"
          --volume "${RUNNER_TEMP}/psr-gateway-tls:/etc/nginx/tls:ro"
          --env NGINX_ENVSUBST_FILTER='^(PSR_)'
          --env NGINX_ENVSUBST_OUTPUT_DIR=/tmp/conf.d
          --env NGINX_ENTRYPOINT_QUIET_LOGS=1
          --env PSR_PUBLIC_HOST=research.example.org
          --env PSR_UPSTREAM_HOST=psr-public
          --env PSR_UPSTREAM_PORT=8000
          "${NGINX_IMAGE}"
          nginx -t -c /etc/nginx/nginx.conf

      - name: Build isolated test image
        run: docker build --target test --tag psr-public:test .

      - name: Start hardened fixture container
        run: >-
          docker run --detach --name psr-public-test
          --network none
          --read-only
          --cap-drop=ALL
          --security-opt=no-new-privileges
          --pids-limit=128
          --memory=512m
          --cpus=1.0
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
          --tmpfs /var/lib/psr/ephemeral:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=10001,gid=10001
          --tmpfs /run/psr:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=10001,gid=10001
          --env PSR_ENV=development
          --env PSR_HOST=127.0.0.1
          --env PSR_PUBLIC_URL=http://127.0.0.1:8000
          --env PSR_PUBLIC_FIXTURE_RESEARCH_ENABLED=true
          psr-public:test

      - name: Wait for loopback listener
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec psr-public-test python -c "import socket; connection = socket.create_connection(('127.0.0.1', 8000), 1); connection.close()"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" = "1"

      - name: Run official SDK container smoke
        run: >-
          docker exec psr-public-test
          python /opt/psr/container_smoke.py
          --endpoint http://127.0.0.1:8000/mcp
          --ephemeral-root /var/lib/psr/ephemeral

      - name: Verify runtime hardening and purge
        run: |
          test "$(docker exec psr-public-test id -u)" = "10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' psr-public-test)" = "true"
          if docker exec psr-public-test sh -c "touch /root-write-test"; then
            echo "read-only root filesystem accepted a write"
            exit 1
          fi
          docker exec psr-public-test sh -c "test -w /tmp"
          docker exec psr-public-test sh -c "test -w /var/lib/psr/ephemeral"
          docker exec psr-public-test sh -c 'test -z "$(find /var/lib/psr/ephemeral -mindepth 1 -print -quit)"'

      - name: Build final runtime image
        run: docker build --target runtime --tag psr-public:runtime .

      - name: Inspect final runtime image
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' psr-public:runtime)" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' psr-public:runtime)" = '["psr-mcp"]'

      - name: Emit restricted container logs
        if: always()
        run: docker logs psr-public-test 2>&1 || true

      - name: Remove test container
        if: always()
        run: docker rm --force psr-public-test 2>/dev/null || true
