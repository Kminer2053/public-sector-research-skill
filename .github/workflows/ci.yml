name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-quality:
    name: Foundation quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PSR_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PSR_TEST_OWNER_DATABASE_URL: postgresql://psr_test_owner:psr_test@127.0.0.1:5432/psr_test
      PSR_TEST_RUNTIME_DATABASE_URL: postgresql://psr_test_runtime:psr_test@127.0.0.1:5432/psr_test
      PSR_TEST_OWNER_ROLE: psr_test_owner
      PSR_TEST_RUNTIME_ROLE: psr_test_runtime
      PSR_TEST_DATABASE: psr_test
      PSR_TEST_ROLE_PASSWORD: psr_test
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --all-groups --frozen

      - name: Audit locked dependencies
        run: uv audit --preview-features audit --frozen

      - name: Verify dependency license manifest
        run: uv run --frozen python scripts/dependency_licenses.py --check

      - name: Bootstrap PostgreSQL test roles and database
        run: uv run --frozen python scripts/bootstrap_postgres_test.py

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen mypy src tests scripts

      - name: Test with branch coverage
        run: uv run --frozen pytest --cov=psr_mcp --cov-branch --cov-report=term-missing

      - name: Build distribution
        run: uv build

      - name: Generate release SBOM
        run: >-
          uv export --preview-features sbom-export --frozen --no-dev
          --format cyclonedx1.5 --output-file dist/sbom.cdx.json

      - name: Verify release SBOM
        run: test -s dist/sbom.cdx.json
