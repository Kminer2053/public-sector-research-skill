worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Deliberately exclude client IP, Host, URI, query, headers, request body,
    # response body, operation ID, feedback token, and MCP session ID.
    log_format psr_content_free escape=json
        '{"timestamp":"$time_iso8601","method":"$request_method","status":$status,'
        '"request_seconds":$request_time,"response_bytes":$body_bytes_sent,'
        '"request_limit":"$limit_req_status","connection_limit":"$limit_conn_status"}';
    access_log /dev/stdout psr_content_free;

    client_body_temp_path /tmp/client_body 1 2;
    proxy_temp_path /tmp/proxy 1 2;

    limit_req_zone $binary_remote_addr zone=psr_per_ip:10m rate=60r/m;
    limit_req_zone $server_name zone=psr_global:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=psr_per_ip_conn:10m;
    limit_conn_zone $server_name zone=psr_global_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;

    include /tmp/conf.d/*.conf;
}
