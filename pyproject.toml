[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "public-sector-research-mcp"
version = "0.1.0.dev0"
description = "Evidence-first MCP service for public-sector research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "httpx>=0.28,<1",
  "mcp>=1.28,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.11,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "uvicorn>=0.35,<1",
]

[project.scripts]
psr-mcp = "psr_mcp.cli.main:serve"
psrctl = "psr_mcp.cli.main:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/psr_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["psr_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires a PostgreSQL integration environment",
  "oauth: requires an OAuth/OIDC integration environment",
  "remote: requires a remote MCP endpoint",
]

[tool.coverage.run]
branch = true
source = ["psr_mcp"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
